<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1640" role="img" aria-labelledby="title desc">
  <title id="title">CS2 箱子倒余额操作流程</title>
  <desc id="desc">人民币在悠悠有品购买 CS2 箱子，通过 Steam 交易收货，等待交易保护解除后在 Steam 社区市场出售；交易和市场上架在 Steam Mobile 中检查并确认。</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.7"/>
    </pattern>
    <marker id="arrow" markerWidth="11" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0L10 4L0 8Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="11" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0L10 4L0 8Z" fill="#34d399"/>
    </marker>
    <marker id="arrow-rose" markerWidth="11" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0L10 4L0 8Z" fill="#fb7185"/>
    </marker>
    <style>
      text { font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .title { fill: #f8fafc; font-size: 29px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-size: 15px; }
      .step-title { fill: #f8fafc; font-size: 19px; font-weight: 700; }
      .step-desc { fill: #cbd5e1; font-size: 14px; }
      .note-title { fill: #f8fafc; font-size: 17px; font-weight: 700; }
      .note-text { fill: #cbd5e1; font-size: 13px; }
      .small { fill: #94a3b8; font-size: 12px; }
      .decision { fill: #f8fafc; font-size: 15px; font-weight: 700; text-anchor: middle; }
      .branch { font-size: 13px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1560" height="1640" fill="#0f172a"/>
  <rect width="1560" height="1640" fill="url(#grid)"/>

  <!-- Title -->
  <text x="60" y="66" class="title">CS2 箱子倒余额：从人民币到 Steam 钱包</text>
  <text x="60" y="98" class="subtitle">买入箱子 → Steam 交易收货 → 等待限制解除 → 社区市场出售 → 钱包入账</text>

  <!-- Main-flow connectors -->
  <g fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="750" y1="218" x2="750" y2="285"/>
    <line x1="750" y1="405" x2="750" y2="470"/>
    <line x1="750" y1="590" x2="750" y2="640"/>
    <line x1="750" y1="1020" x2="750" y2="1090"/>
  </g>
  <g fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#arrow-rose)">
    <line x1="610" y1="730" x2="400" y2="730"/>
    <line x1="890" y1="1175" x2="1100" y2="1175"/>
  </g>
  <g fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)">
    <line x1="750" y1="820" x2="750" y2="895"/>
    <line x1="750" y1="1260" x2="750" y2="1330"/>
  </g>

  <!-- Start -->
  <rect x="515" y="145" width="470" height="73" rx="28" fill="#0f172a"/>
  <rect x="515" y="145" width="470" height="73" rx="28" fill="rgba(59,130,246,0.22)" stroke="#60a5fa" stroke-width="2"/>
  <text x="750" y="176" class="step-title" text-anchor="middle">先确定要换入的钱包余额</text>
  <text x="750" y="199" class="step-desc" text-anchor="middle">本流程以可交易的 CS2 箱子为例</text>

  <!-- Step 1 -->
  <rect x="430" y="285" width="640" height="120" rx="12" fill="#0f172a"/>
  <rect x="430" y="285" width="640" height="120" rx="12" fill="rgba(8,51,68,0.62)" stroke="#22d3ee" stroke-width="2"/>
  <circle cx="470" cy="326" r="22" fill="#083344" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="470" y="332" fill="#67e8f9" font-size="17" font-weight="700" text-anchor="middle">1</text>
  <text x="510" y="324" class="step-title">悠悠有品：用人民币买箱子</text>
  <text x="510" y="353" class="step-desc">优先看近期成交量、求购情况和到手单价；核对箱名、数量与平台费用。</text>
  <text x="510" y="378" class="small">具体箱子与价格随行情变化，不按固定星期或旧价格下单。</text>

  <!-- Step 2 -->
  <rect x="430" y="470" width="640" height="120" rx="12" fill="#0f172a"/>
  <rect x="430" y="470" width="640" height="120" rx="12" fill="rgba(6,78,59,0.55)" stroke="#34d399" stroke-width="2"/>
  <circle cx="470" cy="511" r="22" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
  <text x="470" y="517" fill="#6ee7b7" font-size="17" font-weight="700" text-anchor="middle">2</text>
  <text x="510" y="509" class="step-title">Steam 交易：把箱子收进库存</text>
  <text x="510" y="538" class="step-desc">按平台提示发起或接收交易；确认对方、箱子名称和数量后再确认。</text>
  <text x="510" y="563" class="small">不要提供 Steam 密码或令牌验证码，也不要批准自己没发起的交易。</text>

  <!-- Decision 1 -->
  <polygon points="750,640 890,730 750,820 610,730" fill="#0f172a"/>
  <polygon points="750,640 890,730 750,820 610,730" fill="rgba(120,53,15,0.38)" stroke="#fbbf24" stroke-width="2"/>
  <text x="750" y="722" class="decision">Steam 库存显示</text>
  <text x="750" y="745" class="decision">可以再次交易 / 上架？</text>
  <text x="785" y="858" class="branch" fill="#34d399">是</text>
  <text x="474" y="716" class="branch" fill="#fb7185">否</text>

  <!-- Branch: wait -->
  <rect x="50" y="665" width="350" height="132" rx="10" fill="#0f172a"/>
  <rect x="50" y="665" width="350" height="132" rx="10" fill="rgba(136,19,55,0.26)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="75" y="700" class="note-title">先等限制解除</text>
  <text x="75" y="729" class="note-text">CS2 交易物品有 7 天交易保护期。</text>
  <text x="75" y="751" class="note-text">保护期内不可再次转移；Steam 会显示物品状态。</text>
  <text x="75" y="775" class="small">交易也可能在保护期内被撤销。</text>

  <!-- Step 3 -->
  <rect x="430" y="895" width="640" height="125" rx="12" fill="#0f172a"/>
  <rect x="430" y="895" width="640" height="125" rx="12" fill="rgba(8,51,68,0.62)" stroke="#22d3ee" stroke-width="2"/>
  <circle cx="470" cy="936" r="22" fill="#083344" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="470" y="942" fill="#67e8f9" font-size="17" font-weight="700" text-anchor="middle">3</text>
  <text x="510" y="934" class="step-title">Steam 库存：选择 CS2 箱子并出售</text>
  <text x="510" y="963" class="step-desc">打开物品详情的出售流程；先比较近期成交和当前求购价，再设定售价。</text>
  <text x="510" y="989" class="small">估算按 Steam 市场价扣除约 15% 手续费；确认页金额用于核对实际净收入。</text>

  <!-- Decision 2 -->
  <polygon points="750,1090 890,1175 750,1260 610,1175" fill="#0f172a"/>
  <polygon points="750,1090 890,1175 750,1260 610,1175" fill="rgba(120,53,15,0.38)" stroke="#fbbf24" stroke-width="2"/>
  <text x="750" y="1170" class="decision">物品已成交？</text>
  <text x="786" y="1301" class="branch" fill="#34d399">是</text>
  <text x="1005" y="1162" class="branch" fill="#fb7185">否</text>

  <!-- Branch: no sale -->
  <rect x="1100" y="1110" width="390" height="130" rx="10" fill="#0f172a"/>
  <rect x="1100" y="1110" width="390" height="130" rx="10" fill="rgba(120,53,15,0.28)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="1125" y="1145" class="note-title">还没卖出</text>
  <text x="1125" y="1175" class="note-text">可以继续等待，或根据最新求购价和成交</text>
  <text x="1125" y="1198" class="note-text">情况调整售价；降价会减少最终到账额。</text>

  <!-- Step 4 -->
  <rect x="430" y="1330" width="640" height="112" rx="12" fill="#0f172a"/>
  <rect x="430" y="1330" width="640" height="112" rx="12" fill="rgba(76,29,149,0.5)" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="470" cy="1371" r="22" fill="#4c1d95" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="470" y="1377" fill="#ddd6fe" font-size="17" font-weight="700" text-anchor="middle">4</text>
  <text x="510" y="1369" class="step-title">成交后：净收入进入 Steam 钱包</text>
  <text x="510" y="1398" class="step-desc">余额只能在 Steam 内消费，不能兑换人民币或转到其他账号。</text>

  <!-- Pricing callout -->
  <rect x="1120" y="285" width="370" height="420" rx="12" fill="#0f172a"/>
  <rect x="1120" y="285" width="370" height="420" rx="12" fill="rgba(30,41,59,0.72)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1150" y="328" class="note-title">倒余额成本怎么算</text>
  <text x="1150" y="367" class="note-text">估算净收入时先扣约 15% 手续费：</text>
  <text x="1170" y="395" class="note-text">Steam 市场成交价 × (1 − 0.15)</text>
  <text x="1170" y="421" class="note-text">Steam 确认页可核对实际净收入</text>
  <line x1="1150" y1="446" x2="1460" y2="446" stroke="#475569"/>
  <text x="1150" y="481" fill="#67e8f9" font-size="15" font-weight="700">每 100 元预估净收入的成本</text>
  <text x="1150" y="514" class="note-text">预估净收入 = 市场价 × 0.85</text>
  <text x="1150" y="538" class="note-text">每 100 元成本 = 总支出 ÷ 净收入 × 100</text>
  <text x="1150" y="573" class="small">例如：支出 90 元，市场价 100 元，</text>
  <text x="1150" y="595" class="small">净收入约 85 元，每 100 元成本约 105.88 元。</text>
  <text x="1150" y="632" fill="#fbbf24" font-size="13" font-weight="700">15% 为估算；实际金额看 Steam 确认页。</text>
  <text x="1150" y="661" class="small">低价物品的最低费用或取整会影响结果。</text>

  <!-- Mobile confirmations and optional accelerators -->
  <rect x="1120" y="750" width="370" height="300" rx="12" fill="#0f172a"/>
  <rect x="1120" y="750" width="370" height="300" rx="12" fill="rgba(6,78,59,0.42)" stroke="#34d399" stroke-width="1.5"/>
  <text x="1150" y="790" class="note-title">Steam 手机确认</text>
  <text x="1150" y="820" class="small">Steam Mobile → Steam Guard → 确认请求</text>
  <rect x="1150" y="840" width="310" height="55" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="1305" y="863" class="note-text" text-anchor="middle">交易：核对对象、物品和数量</text>
  <text x="1305" y="884" class="note-text" text-anchor="middle">上架：核对箱子、数量和售价</text>
  <text x="1150" y="925" fill="#6ee7b7" font-size="13" font-weight="700">只批准自己刚才发起且信息相符的请求。</text>
  <line x1="1150" y1="946" x2="1460" y2="946" stroke="#475569"/>
  <text x="1150" y="973" class="note-text">手机网络不畅：小黑盒加速器（可选）</text>
  <text x="1150" y="996" class="note-text">电脑网络不畅：Watt Toolkit / Steam++（可选）</text>
  <text x="1150" y="1028" class="small">加速只帮助连接，不代替 Steam 官方确认。</text>

  <!-- Bottom note -->
  <rect x="60" y="1490" width="1430" height="92" rx="10" fill="#0f172a"/>
  <rect x="60" y="1490" width="1430" height="92" rx="10" fill="rgba(136,19,55,0.23)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="90" y="1527" fill="#fda4af" font-size="15" font-weight="700">记住：市场价会波动，物品也可能等不到买家；卖出的钱是 Steam 钱包余额，不是现金。</text>
  <text x="90" y="1557" class="small">比较游戏时，再将 Steam 商店人民币标价 × 每 100 元预估净收入的倒余额成本 ÷ 100，与支付宝直购和同版本 CD Key 价格比较。</text>
</svg>
